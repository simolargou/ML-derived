name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting and types
        run: |
          npm run format:check
          npm run typecheck
      - name: Test mathematical engines
        run: npm test
      - name: Check Python companions
        run: python -I -S scripts/check_python.py
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test the production application
        run: npm run test:e2e:production
      - name: Check repository subpath hosting
        run: npm run test:pages
